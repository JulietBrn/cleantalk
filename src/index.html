<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <meta name="description" content="" />
    <link rel="icon" href="assets/img/logo.png" type="image/x-icon" />
    <link rel="shortcut icon" href="assets/img/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a href="index.html" class="logo">
            <img
              class="logo-img img-fill"
              src="assets/img/logo.png"
              alt="Logo"
            />
          </a>

          <ul class="nav-menu header__nav-menu">
            <li class="nav-menu__item">
              <a class="nav-menu__link" href="index.html#form">Order</a>
            </li>
          </ul>
          <div class="burger">
            <span class="burger-span"></span>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <section class="section hero">
        <div class="container">
          <div class="title-wrap">
            <h1></h1>
          </div>
        </div>
      </section>

      <section class="section" id="form">
        <div class="container">
          <div class="title-wrap">
            <h2>Registration</h2>
          </div>
          <form class="form" method="post">
            <div class="input-wrap">
              <label for="name">Name Surname</label>
              <input class="form__input" type="text" name="name" required />
            </div>
            <div class="input-wrap">
              <label for="email">Email</label>
              <input class="form__input" type="email" name="email" required />
            </div>
            <div class="input-wrap">
              <label for="phone">Phone</label>
              <input class="form__input" type="text" name="phone" required />
            </div>

            <div class="input-wrap">
              <label for="referral">Where did you find us</label>
              <select name="referral" id="referral">
                <option value="google">Google</option>
                <option value="linkedin">Linkedin</option>
                <option value="facebook">Facebook</option>
                <option value="instagram">Instagram</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="input-wrap">
              <label for="password">Password</label>
              <input
                class="form__input"
                type="password"
                name="password"
                required
              />
            </div>

            <div class="input-wrap">
              <label for="confirm-password">Confirm password</label>
              <input
                class="form__input"
                type="password"
                name="confirm-password"
                required
              />
            </div>

            <div class="form__checkbox">
              <input type="checkbox" name="privacy" value="on" required />
              I agree with
              <a href="privacy-policy.html">Terms and Conditions</a>
            </div>

            <button class="button button-primary">Register</button>
          </form>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
